<!DOCTYPE html>
<html lang=en style="color-scheme:light dark"><head><meta charset=utf-8><title>Light dark</title>
<style>
body{margin:0;font:13px Arial,sans-serif}
section{padding:8px 16px;background:Canvas;color:CanvasText;overflow:hidden}
h2{font-size:14px;margin:0 0 6px}
.row{display:flex;align-items:center;gap:10px;margin:4px 0}
.name{width:90px;flex:none}
.ring input,.ring textarea,.ring select,.ring button{outline:auto}
</style></head><body>
<section class="" style=""><h2>color-scheme: light dark</h2>
<div class=row><span class=name>text</span><input value="Abc"></div>
<div class=row><span class=name>placeholder</span><input placeholder="Name"></div>
<div class=row><span class=name>password</span><input type=password value="abc"></div>
<div class=row><span class=name>textarea</span><textarea style="width:120px;height:34px">Notes</textarea></div>
<div class=row><span class=name>select</span><select><option>One</option><option>Two</option></select></div>
<div class=row><span class=name>listbox</span><select multiple style="height:40px"><option selected>One</option><option>Two</option></select></div>
<div class=row><span class=name>button</span><button>Save</button></div>
<div class=row><span class=name>input-button</span><input type=button value="Go"></div>
<div class=row><span class=name>checkbox</span><input type=checkbox></div>
<div class=row><span class=name>checkbox-on</span><input type=checkbox checked></div>
<div class=row><span class=name>radio</span><input type=radio name=r></div>
<div class=row><span class=name>radio-on</span><input type=radio name=s checked></div>
<div class=row><span class=name>range</span><input type=range value=40></div>
<div class=row><span class=name>progress</span><progress value=0.6></progress></div>
<div class=row><span class=name>meter</span><meter value=0.5></meter></div>
<div class=row><span class=name>meter-low</span><meter min=0 max=10 low=5 high=8 optimum=9 value=2></meter></div>
<div class=row><span class=name>fieldset</span><fieldset style="margin:0;width:120px"><legend>Group</legend>x</fieldset></div>
</section>
</body></html>
