<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;font:14px/20px Arial,sans-serif}
.o{display:inline-flex;vertical-align:middle;margin:4px}
.a>div{width:36px;aspect-ratio:1;display:block;overflow:hidden}
.b>div{width:36px;aspect-ratio:1;display:flex;overflow:hidden;justify-content:center;align-items:center}
.c>div{width:36px;aspect-ratio:1;overflow:hidden}
.d>div{width:36px;aspect-ratio:1}
.e{display:flex}
</style></head><body>
<div class="o a"><div><span>KW</span></div></div>
<div class="o b"><div><span>KW</span></div></div>
<div class="o c"><div><span>KW</span></div></div>
<div class="o d"><div><span>KW</span></div></div>
<div class="e a"><div><span>KW</span></div></div>
<div class="e b"><div><span>KW</span></div></div>
<div style="width:36px;aspect-ratio:1;overflow:hidden">KW</div>
<div style="width:36px;aspect-ratio:1">KW</div>
<div style="width:36px;aspect-ratio:1;min-height:0">KW<br>KW<br>KW</div>
<div style="display:flex;width:36px;aspect-ratio:1">KW</div>
</body></html>
