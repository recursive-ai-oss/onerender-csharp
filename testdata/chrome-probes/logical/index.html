<!DOCTYPE html><html><head><meta charset="utf-8"><style>
:root{--s:.25rem}
body{margin:0;font:14px/20px Arial,sans-serif}
div{background:#eee;margin-bottom:10px}
.a{padding-inline:24px}
.b{padding-block:8px}
.c{padding-inline:calc(var(--s) * 6)}
.d{padding-left:calc(var(--s) * 6)}
.e{padding:calc(var(--s) * 4)}
.f{margin-inline:auto;width:200px}
.g{padding-inline-start:30px;padding-block-end:7px}
.h{border-inline:3px solid red}
.i{--p:12px;padding-inline:var(--p)}
.j{inline-size:300px;block-size:30px}
.k{max-inline-size:100px;min-block-size:40px}
.l{margin-block:5px 9px}
.m{margin-inline-start:50px}
.n{border-block-start:4px solid blue}
.o{border-radius:calc(var(--s) * 2)}
.p2{padding-top:calc(var(--s) * 4)}
.p4{padding-block-start:calc(var(--s) * 4)}
.p7{margin-inline:auto;max-width:calc(var(--s) * 40);}
</style></head><body>
<div class="a">a</div><div class="b">b</div><div class="c">c</div><div class="d">d</div><div class="e">e</div><div class="f">f</div><div class="g">g</div><div class="h">h</div><div class="i">i</div><div class="j">j</div><div class="k">k</div><div class="l">l</div><div class="m">m</div><div class="n">n</div><div class="o">o</div>
<div class="p2">p2</div><div class="p4">p4</div><div class="p7">p7</div></body></html>
