<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*,::before,::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 Arial,sans-serif}

.m li a{display:grid;grid-auto-flow:column;align-content:flex-start;align-items:center;gap:8px;padding:6px 12px;text-align:start}
.m.e li a{display:block}
.m.f li{display:block}
