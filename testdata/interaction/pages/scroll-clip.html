<!DOCTYPE html>
<html data-scroll="0,60">
<head>
<meta charset="utf-8">
<title>scroll containers, fixed boxes, positioned content in clips</title>
<style>
  div { box-sizing: border-box; }
  #outer { position: relative; margin: 20px 0 0 30px; width: 160px; height: 120px; overflow: auto; background: #eee; }
  #in1 { height: 80px; background: #cfc; }
  #in2 { height: 80px; background: #fcc; }
  #in3 { height: 80px; background: #ccf; }
  #nested { width: 100px; height: 60px; margin: 10px; overflow: auto; background: #ffd; }
  #nk1 { height: 50px; background: #aaf; }
  #nk2 { height: 50px; background: #afa; }
  #abs { position: absolute; left: 100px; top: 150px; width: 40px; height: 40px; background: #f60; }
  #fixed { position: fixed; right: 20px; bottom: 20px; width: 50px; height: 30px; background: #06f; }
  #tall { height: 500px; background: #eef; margin-top: 160px; }
</style>
</head>
<body>
<div id="outer" data-scroll="0,50">
  <div id="in1"></div>
  <div id="nested" data-scroll="0,20"><div id="nk1"></div><div id="nk2"></div></div>
  <div id="in2"></div>
  <div id="abs"></div>
  <div id="in3"></div>
</div>
<div id="tall"></div>
<div id="fixed"></div>
<script src="../../../tools/interaction/probe.js"></script>
</body>
</html>
