<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>cssom view metrics</title>
<style>
  div, span { box-sizing: content-box; }
  #a { margin: 10px 0 0 20px; width: 200px; height: 100px; padding: 5px; border: 3px solid #333; background: #eee; }
  #b { position: relative; left: 7px; top: 4px; width: 50px; height: 30px; margin: 6px; background: #fa0; }
  #pos { position: absolute; left: 300px; top: 50px; width: 40px; height: 40px; border-left: 4px solid; border-top: 2px solid; background: #0af; }
  #c { margin-left: 9px; width: 10px; height: 10px; background: #f0a; }
  #sc { margin-top: 20px; width: 100px; height: 60px; padding: 4px; overflow: auto; border: 1px solid; background: #efe; }
  #sk { width: 300px; height: 500px; background: #cec; }
  #tf { margin-top: 10px; width: 80px; height: 20px; transform: translate(10px, 5px) rotate(10deg); background: #0c0; }
  #bb { box-sizing: border-box; width: 120px; height: 50px; margin-top: 10px; padding: 6px; border: 4px solid; background: #ddf; }
  #fx { position: fixed; left: 250px; top: 220px; width: 30px; height: 30px; background: #f00; }
  #st { position: static; width: 70px; height: 20px; margin-top: 10px; background: #ccc; }
</style>
</head>
<body>
<div id="a"><div id="b"></div></div>
<div id="pos"><div id="c"></div></div>
<div id="sc" data-scroll="30,40"><div id="sk"></div></div>
<div id="tf"></div>
<div id="bb"></div>
<div id="fx"></div>
<div id="st"></div>
<script src="../../../tools/interaction/probe.js"></script>
</body>
</html>
