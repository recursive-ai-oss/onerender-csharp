<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>grid sizing</title>
<style>
body{margin:0;padding:8px;background:#fff}
.g{display:grid;margin:0 0 12px;background:#eee}
.g>div{background:#8ac}
.w{width:300px}
</style></head><body>
<div class="g w" style="grid-template-columns:1fr 1fr;height:auto;grid-template-rows:20% 1fr"><div style="height:10px"></div><div style="height:10px"></div><div></div></div>
<div class="g w" style="height:100px;grid-template-rows:30% 1fr"><div></div><div></div></div>
<div class="g w" style="grid-template-columns:1fr 1fr;min-height:90px;grid-auto-rows:auto"><div style="height:10px"></div><div style="height:20px"></div></div>
<div class="g w" style="grid-template-columns:1fr 1fr;max-height:25px;grid-auto-rows:20px"><div></div><div></div><div></div></div>
<div class="g w" style="grid-template-columns:1fr 1fr;grid-template-rows:minmax(10px,1fr) minmax(20px,2fr);height:120px"><div></div><div></div><div></div></div>
<div class="g w" style="grid-template-columns:100px 1fr"><div style="min-width:150px;height:10px"></div><div style="max-width:50px;height:10px"></div></div>
<div class="g w" style="grid-template-columns:100px 1fr"><div style="width:50%;height:10px"></div><div style="width:50%;height:10px;margin:0 10px"></div></div>
<div class="g w" style="grid-template-columns:1fr 1fr"><div style="height:10px;padding:5px 7px;border:2px solid #444"></div><div style="height:10px;padding:5px;box-sizing:border-box;margin:3px"></div></div>
<div class="g w" style="grid-template-columns:1fr 1fr"><div style="aspect-ratio:2/1"></div><div style="aspect-ratio:1/1;width:50px;align-self:start"></div></div>
<div class="g w" style="grid-template-columns:auto 1fr"><div style="width:40px;height:10px"></div><div style="display:grid;grid-template-columns:20px 20px;height:30px"><div></div><div></div></div></div>
<div class="g w" style="grid-template-columns:1fr 1fr"><div style="overflow:hidden"><div style="width:400px;height:10px"></div></div><div><div style="width:60px;height:10px"></div></div></div>
<div class="g w" style="grid-template-columns:minmax(auto,100px) minmax(100px,auto) 1fr"><div style="width:150px;height:10px"></div><div style="width:50px;height:10px"></div><div style="height:10px"></div></div>
<div class="g w" style="grid-template-columns:repeat(2,min-content) max-content"><div style="width:30px;height:10px"></div><div style="width:40px;height:10px"></div><div style="width:50px;height:10px"></div></div>
<div class="g w" style="grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto"><div style="grid-column:1/3;grid-row:1/3;height:60px"></div><div style="height:10px"></div><div style="height:20px"></div></div>
<div class="g w" style="grid-template-columns:auto auto auto"><div style="grid-column:1/4;width:200px;height:10px"></div><div style="width:20px;height:10px"></div><div style="width:30px;height:10px"></div><div style="width:10px;height:10px"></div></div>
<div class="g" style="width:max-content;grid-template-columns:50px 60px"><div style="height:10px"></div><div style="height:10px"></div></div>
<div class="g" style="width:min-content;grid-template-columns:auto auto"><div style="width:30px;height:10px"></div><div style="width:30px;height:10px"></div></div>
<div class="g" style="width:fit-content;grid-template-columns:auto auto;gap:5px"><div style="width:30px;height:10px"></div><div style="width:30px;height:10px"></div></div>
<div class="g" style="position:relative;left:10px;top:4px;grid-template-columns:50px;width:100px"><div style="position:relative;left:5px;height:10px"></div></div>
<div class="g w" style="grid-template-columns:50px 50px;margin:0 auto 12px;border:3px solid #444;padding:4px"><div style="height:10px"></div></div>
</body></html>
