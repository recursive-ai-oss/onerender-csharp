<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>grid placement</title>
<style>
body{margin:0;padding:8px;background:#fff}
.g{display:grid;margin:0 0 12px;background:#eee;width:300px}
.g>div{background:#8ac;height:10px}
</style></head><body>
<div class="g" style="grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,20px)"><div style="grid-column:2/span 2;grid-row:1"></div><div style="grid-column:-2/-1;grid-row:2"></div><div style="grid-column:1/3;grid-row:2"></div><div></div><div></div></div>
<div class="g" style="grid-template-columns:[a] 1fr [b] 2fr [c];grid-template-areas:'head head' 'side main';grid-template-rows:20px 40px"><div style="grid-area:head"></div><div style="grid-area:side"></div><div style="grid-area:main"></div><div style="grid-column:b/c"></div></div>
<div class="g" style="grid-template-columns:repeat(3,1fr);grid-auto-rows:20px;grid-auto-flow:row dense"><div style="grid-column:span 2"></div><div style="grid-column:span 2"></div><div></div><div></div><div style="grid-column:span 3"></div></div>
<div class="g" style="grid-template-columns:repeat(3,1fr);grid-auto-rows:20px"><div style="grid-column:span 2"></div><div style="grid-column:span 2"></div><div></div><div></div><div style="grid-column:span 3"></div></div>
<div class="g" style="grid-template-rows:repeat(2,20px);grid-auto-flow:column;grid-auto-columns:1fr"><div></div><div></div><div></div><div style="grid-row:span 2"></div><div></div></div>
<div class="g" style="grid-template-columns:repeat(2,1fr);grid-auto-rows:15px"><div style="order:3"></div><div style="order:1"></div><div style="order:2"></div><div style="order:-1"></div></div>
<div class="g" style="grid-template-columns:repeat(3,1fr);grid-template-rows:10px 10px 10px"><div style="grid-column:3;grid-row:1"></div><div style="grid-column:1;grid-row:span 2"></div><div style="grid-row:2/4;grid-column:2/4"></div><div style="grid-area:3/1/4/2"></div></div>
<div class="g" style="grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(20px,auto);gap:6px 4px"><div></div><div style="height:35px"></div><div style="grid-row:3;grid-column:1/-1"></div><div style="grid-row-start:5"></div></div>
</body></html>
