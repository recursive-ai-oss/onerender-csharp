<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>grid subgrid, nesting and abspos</title>
<style>
body{margin:0;padding:8px;background:#fff}
.g{display:grid;margin:0 0 12px;background:#eee;width:300px}
.g div{background:#8ac}
.sub{display:grid;grid-template-columns:subgrid;background:#fc8}
.suby{display:grid;grid-template-rows:subgrid;background:#fc8}
</style></head><body>
<div class="g" style="grid-template-columns:30px 40px 50px 60px;gap:5px"><div class="sub" style="grid-column:2/4"><div style="height:10px"></div><div style="height:12px"></div></div><div style="height:8px"></div></div>
<div class="g" style="grid-template-columns:30px 40px 50px;grid-template-rows:10px 20px"><div class="sub suby" style="grid-column:1/3;grid-row:1/3;padding:3px 4px"><div style="height:5px"></div><div></div><div></div><div style="height:7px"></div></div></div>
<div class="g" style="grid-template-columns:repeat(3,1fr);column-gap:10px"><div class="sub" style="grid-column:1/4;column-gap:2px"><div style="height:5px"></div><div></div><div></div></div></div>
<div class="g" style="grid-template-columns:[a] 20px [b] 30px [c] 40px [d]"><div class="sub" style="grid-column:b/d;grid-template-columns:subgrid [p] [q] [r]"><div style="grid-column:q/r;height:6px"></div></div></div>
<div class="g" style="grid-template-columns:repeat(4,1fr)"><div class="sub" style="grid-column:1/5"><div class="sub" style="grid-column:2/4"><div style="height:9px"></div><div style="height:4px"></div></div></div></div>
<div class="g" style="grid-template-columns:auto 1fr;grid-template-rows:auto auto"><div class="sub suby" style="grid-column:1/3;grid-row:1/3;margin:2px"><div style="width:40px;height:20px"></div><div style="height:10px"></div><div style="height:30px"></div><div style="width:10px"></div></div></div>
<div class="g" style="grid-template-columns:100px 1fr;padding:6px;margin-bottom:12px"><div style="display:grid;grid-template-columns:1fr 2fr;height:30px;padding:2px"><div></div><div></div></div><div style="display:grid;grid-template-rows:20px 1fr;height:50px"><div></div><div></div></div></div>
<div class="g" style="position:relative;grid-template-columns:50px 60px;grid-template-rows:20px 30px;height:60px"><div style="height:5px"></div><div style="position:absolute;grid-column:2;grid-row:2;left:3px;top:4px;right:5px;bottom:6px"></div><div style="position:absolute;grid-column:1/3;top:0;width:10px;height:10px;right:0;left:auto"></div><div style="position:absolute;right:0;bottom:0;width:20px;height:20px"></div></div>
<div class="g" style="grid-template-columns:repeat(auto-fill,minmax(70px,1fr))"><div style="height:10px"></div><div style="height:10px"></div><div style="height:10px"></div></div>
<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(70px,1fr))"><div style="height:10px"></div><div style="height:10px"></div></div>
<div class="g" style="grid-template-columns:repeat(auto-fill,40px);gap:7px;justify-content:center"><div style="height:10px"></div><div style="height:10px"></div></div>
<div style="float:left;display:grid;grid-template-columns:auto 1fr;gap:4px;padding:5px;background:#eee"><div style="width:30px;height:10px"></div><div style="width:50px;height:10px"></div></div>
<div style="clear:both;height:4px"></div>
<div class="g" style="grid-template-columns:1fr 1fr;grid-auto-rows:1fr;height:90px"><div></div><div></div><div></div></div>
</body></html>
