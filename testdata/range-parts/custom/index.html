<!DOCTYPE html>
<html lang=en><head><meta charset=utf-8><title>Custom sliders</title>
<style>
body{margin:0;font:13px Arial,sans-serif}
section{padding:8px 16px}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}
.name{width:110px;flex:none}

.tw{-webkit-appearance:none;appearance:none;width:100%;height:8px;background:#e5e7eb;border-radius:9999px;outline:none;cursor:pointer}
.tw::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#3b82f6;cursor:pointer}
.tw::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#3b82f6;border:0}
.tw2{-webkit-appearance:none;appearance:none;width:240px;height:4px;background:transparent}
.tw2::-webkit-slider-runnable-track{height:4px;background:#d1d5db;border-radius:2px}
.tw2::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;margin-top:-6px;width:16px;height:16px;border-radius:50%;background:#111827;border:2px solid #fff;box-shadow:0 0 0 1px #6b7280}
.pl{-webkit-appearance:none;appearance:none;width:200px;background:transparent}
.pl::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,#f43f5e,#8b5cf6);border-radius:3px}
.pl::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;margin-top:-4px;background:#fff;border:1px solid #444;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sq{-webkit-appearance:none;appearance:none;width:200px;height:20px;background:#eee}
.sq::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:20px;background:#c026d3}
.fill{-webkit-appearance:none;appearance:none;width:200px;height:12px;background:#ddd;overflow:hidden;border-radius:6px}
.fill::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;background:#059669;box-shadow:-400px 0 0 400px #34d399}

</style></head><body>
<section>
<div class=row><span class=name>tailwind w-full</span><input class=tw type=range value=35 style='width:240px'></div>
<div class=row><span class=name>tailwind 0</span><input class=tw type=range value=0 style='width:240px'></div>
<div class=row><span class=name>tailwind 100</span><input class=tw type=range value=100 style='width:240px'></div>
<div class=row><span class=name>track + margin-top</span><input class=tw2 type=range value=60></div>
<div class=row><span class=name>gradient track</span><input class=pl type=range value=25></div>
<div class=row><span class=name>square thumb</span><input class=sq type=range value=70></div>
<div class=row><span class=name>shadow fill</span><input class=fill type=range value=45></div>
<div class=row><span class=name>min/max/step</span><input class=pl type=range min=10 max=20 step=5 value=15></div>
</section>
</body></html>
