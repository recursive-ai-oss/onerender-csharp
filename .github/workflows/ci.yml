name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Build output goes outside the checkout, as it does locally.
      - name: Artifacts directory
        shell: bash
        run: echo "ONERENDER_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OneRender.slnx
      - name: Build
        run: dotnet build --no-restore -c Release OneRender.slnx
      - name: Test
        run: dotnet test --no-build -c Release --solution OneRender.slnx
      - name: Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Publish AOT smoke app (warnings are errors)
        run: dotnet publish tests/OneRender.AotSmoke -c Release -r ${{ matrix.rid }} -o ${{ runner.temp }}/smoke -warnaserror
      - name: Run AOT smoke app
        shell: bash
        run: |
          exe="$RUNNER_TEMP/smoke/OneRender.AotSmoke"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          "$exe"
      - name: Publish WebAssembly smoke app (warnings are errors)
        run: dotnet publish tests/OneRender.WasmSmoke -c Release -o ${{ runner.temp }}/wasm -warnaserror

  pack:
    # Builds the packages as an artifact only; nothing is pushed anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Artifacts directory
        shell: bash
        run: echo "ONERENDER_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        run: dotnet pack OneRender.slnx -c Release -o ${{ runner.temp }}/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*
